name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff "$BASE...$HEAD" -- pubspec.yaml > "$RUNNER_TEMP/pr-pubspec.diff"
          if grep -E '^[-+]version[[:blank:]]*:' "$RUNNER_TEMP/pr-pubspec.diff"; then
            echo 'The release workflow updates the pubspec.yaml version.' >&2
            exit 1
          fi
          node tools/bump-version.js --current
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
